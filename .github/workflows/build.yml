name: build

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  WAILS_VERSION: v1.16.9
  # Node 20 reached end of life in April 2026, 24 is the current long-term-support release
  NODE_VERSION: '24'
  # The Vue CLI 4 / webpack 4 frontend needs the legacy OpenSSL provider on Node 17+
  NODE_OPTIONS: --openssl-legacy-provider
  CGO_ENABLED: '1'

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            binary: vertcoin-ocm.exe
          - os: linux
            runner: ubuntu-latest
            # The patched Wails links webkit2gtk-4.1, which 22.04 has; building on the
            # oldest supported LTS keeps the binary running on 22.04 and later
            container: ubuntu:22.04
            binary: vertcoin-ocm
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git curl zip build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The container runs as root but the workspace is owned by the runner user,
      # so git (and Go's VCS stamping) refuses the repo without this
      - name: Mark workspace as a safe git directory
        if: matrix.container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Ensure MinGW (gcc, windres) is available
        if: matrix.os == 'windows'
        run: |
          if ! command -v windres >/dev/null || ! command -v gcc >/dev/null; then
            choco install mingw -y --no-progress
            echo "C:/ProgramData/mingw64/mingw64/bin" >> "$GITHUB_PATH"
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/cmd/wails@${WAILS_VERSION}

      # Install exactly what the lockfile says, without running package install scripts
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      # go.sum is the integrity record of every Go module the build uses. Fail when it or
      # go.mod is missing something the code needs, or doesn't match what is committed
      - name: Check go.mod and go.sum
        if: matrix.os == 'linux'
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Determine version
        id: version
        run: |
          short_sha="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME}"
            version="${GITHUB_REF_NAME}-g${short_sha}"
          else
            name="dev-${short_sha}"
            # Same as the source default, so dev builds always see updates
            version="0.0-alpha1-g${short_sha}"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        env:
          LDFLAGS: -X github.com/vertcoin-project/one-click-miner-vnext/tracking.version=${{ steps.version.outputs.version }}
          NAME: ${{ steps.version.outputs.name }}
          BINARY: ${{ matrix.binary }}
          OS: ${{ matrix.os }}
        run: |
          wails build -ldflags "$LDFLAGS"
          zipname="vertcoin-ocm-${NAME}-${OS}-x64.zip"
          mkdir -p dist
          if [ "$OS" = windows ]; then
            (cd build && 7z a -tzip "../dist/${zipname}" "${BINARY}")
          else
            (cd build && zip "../dist/${zipname}" "${BINARY}")
          fi
          echo "zip=dist/${zipname}" >> "$GITHUB_OUTPUT"

      # After the build, because the main package embeds the built frontend
      - name: Run Go tests
        run: go test ./...

      # The frontend is bundled into the binary, so verify that every installed
      # package matches the registry's signatures before anything is attested or uploaded
      - name: Verify npm package signatures
        working-directory: frontend
        run: npm audit signatures

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ steps.build.outputs.zip }}
            build/${{ matrix.binary }}

      # Upload the zip as-is so the download isn't a zip inside a zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.build.outputs.zip }}
          archive: false
          if-no-files-found: error

  release:
    name: draft release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: vertcoin-ocm-*.zip
          path: dist
          merge-multiple: true
          # The artifacts are already zips; keep them as they are
          skip-decompress: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--draft --generate-notes --verify-tag --title "$TAG")
          case "$TAG" in
            *alpha*|*beta*|*rc*) flags+=(--prerelease) ;;
          esac
          ls -l dist
          (cd dist && sha256sum *.zip > SHA256SUMS)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" dist/*.zip dist/SHA256SUMS
